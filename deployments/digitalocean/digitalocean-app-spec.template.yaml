name: __APP_NAME__
region: __REGION__
# Re-order form app only. Main web app + scanner apps stay in repo but are not deployed.
static_sites:
  - name: reorder
    github:
      repo: __GITHUB_REPO__
      branch: __GITHUB_BRANCH__
      deploy_on_push: true
    environment_slug: node-js
    source_dir: reorder-app
    output_dir: dist
    build_command: npm install && npm run build
    catchall_document: index.html
    routes:
      - path: /
    envs:
      - key: VITE_SUPABASE_URL
        scope: BUILD_TIME
        type: SECRET
        value: "__VITE_SUPABASE_URL__"
      - key: VITE_SUPABASE_ANON_KEY
        scope: BUILD_TIME
        type: SECRET
        value: "__VITE_SUPABASE_ANON_KEY__"
