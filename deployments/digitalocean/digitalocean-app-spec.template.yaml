name: __APP_NAME__
region: __REGION__
# Re-order form at /; warehouse catalog at /warehouse-catalog; wire tracker at /wire; wire scanner at /wire-scanner.
static_sites:
  - name: warehouse-catalog
    github:
      repo: __GITHUB_REPO__
      branch: __GITHUB_BRANCH__
      deploy_on_push: true
    environment_slug: node-js
    source_dir: warehouse-catalog-app
    output_dir: dist
    build_command: npm install && npm run build
    catchall_document: index.html
    routes:
      - path: /warehouse-catalog
    envs:
      - key: VITE_SUPABASE_URL
        scope: BUILD_TIME
        type: SECRET
        value: "__VITE_SUPABASE_URL__"
      - key: VITE_SUPABASE_ANON_KEY
        scope: BUILD_TIME
        type: SECRET
        value: "__VITE_SUPABASE_ANON_KEY__"
  - name: reorder
    github:
      repo: __GITHUB_REPO__
      branch: __GITHUB_BRANCH__
      deploy_on_push: true
    environment_slug: node-js
    source_dir: reorder-app
    output_dir: dist
    build_command: npm install && npm run build
    catchall_document: index.html
    routes:
      - path: /
    envs:
      - key: VITE_SUPABASE_URL
        scope: BUILD_TIME
        type: SECRET
        value: "__VITE_SUPABASE_URL__"
      - key: VITE_SUPABASE_ANON_KEY
        scope: BUILD_TIME
        type: SECRET
        value: "__VITE_SUPABASE_ANON_KEY__"
  - name: wire-tracker
    github:
      repo: __GITHUB_REPO__
      branch: __GITHUB_BRANCH__
      deploy_on_push: true
    environment_slug: node-js
    source_dir: wire-app
    output_dir: dist
    build_command: npm install && npm run build
    catchall_document: index.html
    routes:
      - path: /wire
    envs:
      - key: VITE_SUPABASE_URL
        scope: BUILD_TIME
        type: SECRET
        value: "__VITE_SUPABASE_URL__"
      - key: VITE_SUPABASE_ANON_KEY
        scope: BUILD_TIME
        type: SECRET
        value: "__VITE_SUPABASE_ANON_KEY__"
  - name: wire-scanner
    github:
      repo: __GITHUB_REPO__
      branch: __GITHUB_BRANCH__
      deploy_on_push: true
