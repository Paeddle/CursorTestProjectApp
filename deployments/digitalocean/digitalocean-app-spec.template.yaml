name: __APP_NAME__
region: __REGION__
# Keep custom domains in this spec. Updating the app without them
# drops TLS for shswebapp.site and causes SSL_ERROR_NO_CYPHER_OVERLAP.
domains:
  - domain: www.shswebapp.site
    type: PRIMARY
    zone: shswebapp.site
  - domain: shswebapp.site
    type: ALIAS
    zone: shswebapp.site
# Home nav at /; reorder at /reorder; wire tracker at /wire; wire scanner at /wire-scanner.
# Parts tracker at /parts; parts scanner at /parts-scanner; inventory transfer at /inventory-transfer.
# Warehouse catalog remains at /warehouse-catalog but is not linked from the home page.
# Time clock is at /timeclock and is intentionally not linked from the home login page.
static_sites:
  - name: home
    github:
      repo: __GITHUB_REPO__
      branch: __GITHUB_BRANCH__
      deploy_on_push: true
    environment_slug: node-js
    source_dir: home-app
    output_dir: dist
    build_command: npm install && npm run build
    catchall_document: index.html
    routes:
      - path: /
    envs:
      - key: VITE_SUPABASE_URL
        scope: BUILD_TIME
        type: SECRET
        value: "__VITE_SUPABASE_URL__"
      - key: VITE_SUPABASE_ANON_KEY
        scope: BUILD_TIME
        type: SECRET
        value: "__VITE_SUPABASE_ANON_KEY__"
  - name: reorder
